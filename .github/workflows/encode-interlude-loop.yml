name: Encode the interlude clip as an animated image

# The interlude clip is decorative scenery. Served as a <video> it can be taken
# over by the system player full screen inside in-app webviews (TikTok on iOS),
# and no page-side attribute prevents that - allowsInlineMediaPlayback belongs
# to the host app, not to us. An <img> cannot go full screen on any browser, so
# the clip ships as an animated WebP instead.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/encode-interlude-loop.yml'

jobs:
  encode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download source clip
        env:
          SRC: https://d8j0ntlcm91z4.cloudfront.net/user_33Ej8t2gAxUeQ3elHCepqWYPaUg/hf_20260710_171358_1ba11fcd-81fd-499d-853b-853ad6891c30.mp4
        run: |
          curl -fL --retry 3 -o /tmp/interlude.mp4 "$SRC"
          ffprobe -v error -show_entries stream=width,height,r_frame_rate \
                  -show_entries format=duration,size -of default=nw=1 /tmp/interlude.mp4

      - name: Encode animated WebP and poster
        run: |
          # Animated WebP has no interframe motion compensation, so cost scales
          # with pixels x frames and nothing else. Twelve seconds at 1280/15fps
          # came to 4.7MB and stuttered on an iPhone, which decodes every frame
          # on the main thread. Six seconds is the length that matters here.
          #
          # Rather than guess a quality that lands under budget - twice now it
          # has not - walk down a ladder until one does.
          BUDGET=1100000
          for CFG in "900 12 42" "820 12 38" "740 12 34" "660 10 32" "560 10 30"; do
            set -- $CFG
            W=$1; FPS=$2; Q=$3
            ffmpeg -y -loglevel error -i /tmp/interlude.mp4 -an -t 6 \
              -vf "fps=${FPS},scale=${W}:-2:flags=lanczos" \
              -c:v libwebp -lossless 0 -q:v "$Q" -compression_level 6 \
              -loop 0 -preset picture \
              assets/interlude-loop.webp
            BYTES=$(stat -c%s assets/interlude-loop.webp)
            echo "${W}px ${FPS}fps q${Q} -> ${BYTES} bytes"
            if [ "$BYTES" -le "$BUDGET" ]; then
              echo "PICKED ${W}px ${FPS}fps q${Q} at ${BYTES} bytes"
              break
            fi
          done

          ffmpeg -y -loglevel error -i /tmp/interlude.mp4 -frames:v 1 -update 1 \
            -vf "scale=1280:-2:flags=lanczos" -q:v 4 \
            assets/interlude-poster.jpg

          ls -la assets/interlude-loop.webp assets/interlude-poster.jpg

      - name: Fail if even the smallest rung is too heavy
        run: |
          BYTES=$(stat -c%s assets/interlude-loop.webp)
          if [ "$BYTES" -gt 1100000 ]; then
            echo "Every rung of the ladder came out over 1.1MB (last: ${BYTES})."
            echo "Shorten -t below 6s, or accept a still frame instead."
            exit 1
          fi

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/interlude-loop.webp assets/interlude-poster.jpg
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Encode the interlude clip as an animated WebP (CI)"
          git push
